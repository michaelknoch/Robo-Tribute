name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-deps.sh') }}
      - run: ./scripts/build-deps.sh
      - run: xcrun swift test
